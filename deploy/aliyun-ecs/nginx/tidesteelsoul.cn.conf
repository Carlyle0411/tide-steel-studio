server {
    listen 80;
    listen [::]:80;
    server_name tidesteelsoul.cn www.tidesteelsoul.cn;

    root /var/www/tidesteelsoul.cn;
    index index.html;

    access_log /var/log/nginx/tidesteelsoul.cn.access.log;
    error_log  /var/log/nginx/tidesteelsoul.cn.error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:png|jpg|jpeg|webp|gif|ico|avif)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.(?:glb|gltf|bin|mp4|webm|mov)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;
    }

    client_max_body_size 200M;
}
